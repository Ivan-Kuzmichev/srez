name: srez

x-app: &app
  build:
    context: .
    platforms:
      - ${SREZ_PLATFORM:-linux/amd64}
  image: srez:latest
  platform: ${SREZ_PLATFORM:-linux/amd64}
  # Values come from .env next to this file (or the shell); see .env.example.
  environment:
    DATABASE_PATH: /data/srez.db
    APP_URL: ${APP_URL:-http://localhost:3000}
    APP_SECRET_KEY: ${APP_SECRET_KEY:-}
    AUTH_SECRET: ${AUTH_SECRET:-}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    TINVEST_PROXY_URL: ${TINVEST_PROXY_URL:-}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    TZ: ${TZ:-UTC}
    PUID: ${PUID:-}
    PGID: ${PGID:-}
  volumes:
    # Must be a local disk on the host: SQLite locking is unreliable over SMB/NFS.
    - ./data:/data
  restart: unless-stopped

services:
  web:
    <<: *app
    command: ['web']
    ports:
      # Loopback by default: the reverse proxy on the same host reaches it, the network does not.
      # Set SREZ_BIND=0.0.0.0 only when the proxy runs on another machine.
      - '${SREZ_BIND:-127.0.0.1}:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    command: ['worker']
    depends_on:
      web:
        condition: service_healthy
