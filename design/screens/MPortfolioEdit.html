<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Телефон: состав и цели портфеля</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4C4FF}a:hover{color:#DCE4FF}
</style>
</head>
<body>
<div style="width: 390px; min-height: 1560px; box-sizing: border-box; display: flex; flex-direction: column; background: #0F1214; color: #ECEFF1; font-family: 'Onest', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.4">

<main style="flex: 1; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; align-items: center; gap: 4px">
<a href="MPortfolio.html" aria-label="Назад к портфелю" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -12px; color: #ECEFF1"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Состав и цели</h1>
</header>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9BA6AE">Название
<input type="text" value="Долгосрочный" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #161A1D; color: #ECEFF1; font-family: inherit; font-size: 16px">
</label>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9BA6AE">Бенчмарк
<select style="height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #161A1D; color: #ECEFF1; font-family: inherit; font-size: 16px"><option>Индекс МосБиржи полной доходности</option><option>Индекс гособлигаций</option><option>Без бенчмарка</option></select>
</label>

<section style="background: #161A1D; border: 1px solid #262C31; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Из чего собран</h2>
<div style="font-size: 12px; color: #9BA6AE">Один счёт может входить в несколько портфелей</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="font-weight: 500">Брокерский</span><span style="font-size: 12px; color: #9BA6AE">Т-Инвестиции, авто</span></div>
<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px">
<select aria-label="Как входит счёт Брокерский" style="height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #0F1214; color: #ECEFF1; font-family: inherit; font-size: 16px"><option>По тегу</option><option>Целиком</option><option>Не входит</option></select>
<select aria-label="Тег для счёта Брокерский" style="height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #0F1214; color: #ECEFF1; font-family: inherit; font-size: 16px"><option>пенсия</option><option>детям</option></select>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid #1E2428">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="font-weight: 500">Кошелёк</span><span style="font-size: 12px; color: #9BA6AE">Вручную</span></div>
<select aria-label="Как входит счёт Кошелёк" style="height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #0F1214; color: #ECEFF1; font-family: inherit; font-size: 16px"><option>Целиком</option><option>По тегу</option><option>Не входит</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid #1E2428">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="color: #9BA6AE">ИИС</span><span style="font-size: 12px; color: #9BA6AE">Т-Инвестиции, авто</span></div>
<select aria-label="Как входит счёт ИИС" style="height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #0F1214; color: #9BA6AE; font-family: inherit; font-size: 16px"><option>Не входит</option><option>Целиком</option><option>По тегу</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid #1E2428">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="color: #9BA6AE">Вклад</span><span style="font-size: 12px; color: #9BA6AE">Вручную</span></div>
<select aria-label="Как входит счёт Вклад" style="height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #0F1214; color: #9BA6AE; font-family: inherit; font-size: 16px"><option>Не входит</option><option>Целиком</option><option>По тегу</option></select>
</div>
</section>

<section style="background: #161A1D; border: 1px solid #262C31; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Целевые доли</h2>
<span style="display: flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; background: #17251F; color: #4FD1A1; font-size: 12px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #4FD1A1"></span><span>В сумме 100 %</span></span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9BA6AE">Акции, сейчас 38,4 %
<input type="number" value="40" min="0" max="100" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #0F1214; color: #ECEFF1; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9BA6AE">Облигации, сейчас 19,4 %
<input type="number" value="25" min="0" max="100" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #0F1214; color: #ECEFF1; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9BA6AE">Фонды, сейчас 13,1 %
<input type="number" value="15" min="0" max="100" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #0F1214; color: #ECEFF1; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9BA6AE">Крипта, сейчас 20,8 %
<input type="number" value="15" min="0" max="100" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #0F1214; color: #ECEFF1; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9BA6AE">Кэш, сейчас 8,3 %
<input type="number" value="5" min="0" max="100" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #0F1214; color: #ECEFF1; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9BA6AE">Предупреждать, п.п.
<input type="number" value="5" min="1" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262C31; background: #0F1214; color: #ECEFF1; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 16px">
</label>
</div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #8FA8FF"><span>Без целей, только учёт</span></label>
</section>

<section style="background: #161A1D; border: 1px solid #262C31; border-radius: 14px; padding: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 12px; color: #9BA6AE">Попадёт в портфель</span><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 16px; white-space: nowrap">2 946 200 ₽</span></div>
<div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 12px; color: #9BA6AE">Позиций</span><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 16px">8</span></div>
</section>

<button type="button" style="align-self: flex-start; height: 44px; padding: 0; border: 0; background: transparent; color: #FF8A65; font-family: inherit; font-size: 14px">Удалить портфель</button>

</main>

<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 12px 16px 16px; background: #0B0E10; border-top: 1px solid #1E2428">
<a href="MPortfolio.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; border: 1px solid #262C31; background: #161A1D; color: #ECEFF1; font-size: 15px; text-decoration: none">Отмена</a>
<a href="MPortfolio.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; background: #8FA8FF; color: #0F1214; font-size: 15px; font-weight: 600; text-decoration: none">Сохранить</a>
</div>

</div>
</body>
</html>
