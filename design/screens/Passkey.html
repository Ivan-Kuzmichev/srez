<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход с пасскеем</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4C4FF}a:hover{color:#DCE4FF}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; padding: 48px 24px; display: flex; align-items: center; justify-content: center; background: #0F1214; color: #ECEFF1; font-family: 'Onest', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45">
<div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><path d="M11 5a8 8 0 1 0 8 8h-8z" fill="#8FA8FF"></path><path d="M14 2.5V10h7.5A7.5 7.5 0 0 0 14 2.5z" fill="#E3E9FF"></path></svg>
<span style="font-size: 16px; font-weight: 600">Srez</span>
</div>

<section style="background: #161A1D; border: 1px solid #262C31; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 22px">
<span style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; box-sizing: border-box; border-radius: 50%; border: 1px solid #8FA8FF; background: #1A1F23; color: #8FA8FF"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M16 7l3 3M13.5 9.5l2 2"></path></svg></span>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Подтвердите вход</h1>
<div style="color: #9BA6AE; text-wrap: pretty">Браузер откроет своё окно. Приложите палец, посмотрите в камеру или вставьте ключ безопасности. Пароль и код не нужны.</div>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 10px; background: #1A1F23">
<span style="width: 10px; height: 10px; border-radius: 50%; border: 2px solid #8FA8FF; box-sizing: border-box"></span>
<span>Ждём ответа устройства</span>
</div>

<button type="button" style="min-height: 48px; border-radius: 10px; border: 1px solid #3A424A; background: #1A1F23; color: #ECEFF1; font-family: inherit; font-size: 15px; cursor: pointer">Показать окно ещё раз</button>

<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 16px; border-top: 1px solid #262C31">
<a href="Login.html" style="display: flex; align-items: center; min-height: 44px; font-size: 14px; text-decoration: none">Войти по логину и паролю</a>
<span style="font-size: 13px; color: #9BA6AE; text-wrap: pretty">На этом устройстве ещё нет пасскея? Войдите по паролю и добавьте его в настройках.</span>
</div>
</section>

</div>
</div>
</body>
</html>
