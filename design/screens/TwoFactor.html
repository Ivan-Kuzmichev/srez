<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход: код двухфакторной защиты</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4C4FF}a:hover{color:#DCE4FF}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; padding: 48px 24px; display: flex; align-items: center; justify-content: center; background: #0F1214; color: #ECEFF1; font-family: 'Onest', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45">
<div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><path d="M11 5a8 8 0 1 0 8 8h-8z" fill="#8FA8FF"></path><path d="M14 2.5V10h7.5A7.5 7.5 0 0 0 14 2.5z" fill="#E3E9FF"></path></svg>
<span style="font-size: 16px; font-weight: 600">Srez</span>
</div>

<section style="background: #161A1D; border: 1px solid #262C31; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Код подтверждения</h1>
<div style="color: #9BA6AE; text-wrap: pretty">Пароль верный. Введите 6 цифр из приложения-аутентификатора.</div>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9BA6AE">Код из приложения
<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="box-sizing: border-box; width: 100%; min-height: 60px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A424A; background: #0F1214; color: #ECEFF1; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 28px; letter-spacing: 0.4em; text-align: center">
</label>

<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #8FA8FF"><span>Не спрашивать код здесь 30 дней</span></label>

<a href="Main.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 10px; background: #8FA8FF; color: #0F1214; font-size: 15px; font-weight: 600; text-decoration: none">Подтвердить</a>

<div style="display: flex; flex-direction: column; padding-top: 8px; border-top: 1px solid #262C31">
<button type="button" style="display: flex; align-items: center; min-height: 44px; padding: 0; border: 0; background: transparent; color: #B4C4FF; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer">Ввести резервный код</button>
<a href="Passkey.html" style="display: flex; align-items: center; min-height: 44px; font-size: 14px; text-decoration: none">Подтвердить пасскеем</a>
</div>
</section>

<div style="text-align: center; font-size: 13px"><a href="Login.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none">Войти под другим логином</a></div>

</div>
</div>
</body>
</html>
