<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход: неверный пароль</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4C4FF}a:hover{color:#DCE4FF}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; padding: 48px 24px; display: flex; align-items: center; justify-content: center; background: #0F1214; color: #ECEFF1; font-family: 'Onest', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45">
<div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><path d="M11 5a8 8 0 1 0 8 8h-8z" fill="#8FA8FF"></path><path d="M14 2.5V10h7.5A7.5 7.5 0 0 0 14 2.5z" fill="#E3E9FF"></path></svg>
<span style="font-size: 16px; font-weight: 600">Srez</span>
</div>

<section style="background: #161A1D; border: 1px solid #262C31; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Вход</h1>

<div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 10px; border: 1px solid #5A4033; background: #2A1D17; color: #FFB79E; font-size: 14px">
<span style="display: flex; padding-top: 2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v5M12 17h.01"></path><circle cx="12" cy="12" r="9"></circle></svg></span>
<span style="text-wrap: pretty">Неверный логин или пароль. Осталось 3 попытки, после этого вход по паролю закроется на 15 минут.</span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9BA6AE">Логин
<input type="text" value="admin" autocomplete="username webauthn" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A424A; background: #0F1214; color: #ECEFF1; font-family: inherit; font-size: 15px">
</label>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #FFB79E">Пароль
<input type="password" aria-invalid="true" autocomplete="current-password" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #FF8A65; background: #0F1214; color: #ECEFF1; font-family: inherit; font-size: 15px">
</label>

<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #8FA8FF"><span>Запомнить это устройство на 30 дней</span></label>

<a href="TwoFactor.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 10px; background: #8FA8FF; color: #0F1214; font-size: 15px; font-weight: 600; text-decoration: none">Войти</a>

<div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #9BA6AE">
<span style="flex: 1; height: 1px; background: #262C31"></span>
<span>или</span>
<span style="flex: 1; height: 1px; background: #262C31"></span>
</div>

<a href="Passkey.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border-radius: 10px; border: 1px solid #3A424A; background: #1A1F23; color: #ECEFF1; font-size: 15px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M16 7l3 3M13.5 9.5l2 2"></path></svg>
<span>Войти с пасскеем</span>
</a>
</section>

<div style="font-size: 13px; color: #9BA6AE; text-align: center; text-wrap: pretty">Забыли пароль? Его сбрасывает администратор командой на сервере.</div>

</div>
</div>
</body>
</html>
